<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AE 资源工作台</title>
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/layout.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>AE 资源工作台<span id="hostInfo" class="muted" style="font-weight:400;font-size:11px"></span></div>
    <nav class="tabs">
      <button class="tab active" data-tab="files">资源</button>
      <button class="tab" data-tab="effects">效果库</button>
    </nav>
    <div class="top-actions">
      <button class="icon" id="btnSettings" title="设置">⚙</button>
      <button class="icon" id="btnReload" title="刷新当前列表">⟳</button>
      <button class="icon" id="btnHelp" title="使用说明">?</button>
    </div>
  </header>

  <main class="content">
    <!-- ============ 资源 ============ -->
    <section id="tab-files" class="tabpane active">
      <aside class="sidebar">
        <div class="side-head"><span>源库</span><button class="mini" id="btnAddSource" title="添加文件夹">＋</button></div>
        <ul id="sourceList" class="source-list"></ul>
        <div class="side-foot">
          <button class="ghost" id="btnAddSourceFoot">＋ 添加文件夹</button>
          <button class="ghost" id="btnGoLibrary">📚 打开资料库目录</button>
        </div>
      </aside>

      <section class="browser">
        <div class="pathbar">
          <button class="icon" id="btnBack" title="后退 (Alt+←)">←</button>
          <button class="icon" id="btnForward" title="前进 (Alt+→)">→</button>
          <button class="icon" id="btnUp" title="上级 (Backspace)">↑</button>
          <div class="breadcrumb" id="breadcrumb"></div>
          <div class="searchwrap">
            <input id="searchInput" type="search" placeholder="搜索文件..." />
            <label class="chk" title="递归搜索子文件夹"><input type="checkbox" id="recursiveSearch" />递归</label>
          </div>
        </div>
        <div class="filehead" id="fileHead">
          <span class="c-name col" data-sort="name">名称</span>
          <span class="c-type col" data-sort="type">类型</span>
          <span class="c-size col" data-sort="size">大小</span>
          <span class="c-time col" data-sort="mtime">修改时间</span>
        </div>
        <div id="fileList" class="vlist" tabindex="0"></div>
        <div id="gridView" class="gridview hidden"></div>
      </section>

      <aside class="preview">
        <div class="preview-head" id="previewHead">预览</div>
        <div class="preview-body" id="previewBody"></div>
      </aside>
    </section>

    <!-- ============ 效果库 ============ -->
    <section id="tab-effects" class="tabpane">
      <aside class="sidebar">
        <div class="side-head"><span>分类</span><span class="muted" id="fxTotal"></span></div>
        <ul id="catList" class="cat-list"></ul>
        <div class="side-foot">
          <button class="ghost" id="btnAddEffect">＋ 添加效果</button>
          <button class="ghost" id="btnSyncLib">⟳ 从学习工作台同步</button>
          <button class="ghost" id="btnLibManage">⚙ 资料库与映射</button>
        </div>
      </aside>
      <section class="fxmain">
        <div class="pathbar">
          <div class="searchwrap grow">
            <input id="fxSearch" type="search" placeholder="搜索中文名 / 英文名 / 说明 / 用途" />
          </div>
          <select id="fxFilter">
            <option value="all">全部</option>
            <option value="installed">仅已安装</option>
            <option value="missing">仅未安装</option>
            <option value="bound">手工绑定</option>
          </select>
          <button class="mini" id="btnScanInstalled" title="扫描 AE 已安装效果">扫描已安装</button>
        </div>
        <div class="fxhead" id="fxHead">
          <span class="c1">效果名称</span>
          <span class="c2">说明</span>
          <span class="c3">用途</span>
          <span class="c4">状态 / 操作</span>
        </div>
        <div id="fxList" class="vlist" tabindex="0"></div>
      </section>
    </section>
  </main>

  <footer class="statusbar">
    <span id="statusText" class="grow">就绪</span>
    <span id="selInfo" class="muted"></span>
    <button id="btnImportSelected" class="primary mini">导入选中</button>
    <button id="btnImportAll" class="ghost mini">全部导入</button>
    <button id="btnViewToggle" class="icon" title="列表 / 缩略图">▦</button>
  </footer>
</div>

<div id="ctxMenu" class="ctx hidden"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast hidden"></div>

<script src="js/core.js"></script>
<script src="js/cep.js"></script>
<script src="js/nodeapi.js"></script>
<script src="js/store.js"></script>
<script src="js/vlist.js"></script>
<script src="js/preview.js"></script>
<script src="js/files.js"></script>
<script src="js/effects.js"></script>
<script src="js/app.js"></script>
</body>
</html>
