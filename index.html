<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KNOW Motion Workbench</title>
    <link rel="stylesheet" href="css/panel.css">
</head>
<body>
    <!--
    THESIS: A motion cue board makes every tool readable as an action, not a decorative tile; it refuses a generic script list.
    OWN-WORLD: Graphite editing surfaces, bone labels, oxidized-copper state, clipped motion diagrams, and one precise cue rail.
    STORY: Read the live AE selection, find a visual cue, inspect its requirement, tune it, execute it, and see the result immediately.
    FIRST VIEWPORT: A 58px command header, live context strip, narrow category rail, two-column cue board, and a bottom parameter drawer.
    FORM: Motion Cue Board, grounded direction five in Operate mode; seed af5f5969.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div class="app-shell" id="app">
        <header class="command-header">
            <div class="brand-lockup" aria-label="KNOW Motion Workbench">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M5 7.5h8.5L8.5 16l5 8.5H5L10 16 5 7.5Z" />
                    <path d="M18.5 7.5H27L22 16l5 8.5h-8.5L23.5 16l-5-8.5Z" />
                </svg>
                <div>
                    <h1>KNOW</h1>
                    <p>MOTION WORKBENCH</p>
                </div>
            </div>
            <div class="header-signal" aria-hidden="true"><span></span></div>
            <div class="header-actions">
                <span class="host-badge" id="hostBadge"><i></i><b>检测中</b></span>
                <button class="icon-button" id="refreshButton" type="button" aria-label="刷新 AE 选择状态" title="刷新 AE 选择状态">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a7.5 7.5 0 1 0 .35 7M19 8V3m0 5h-5" /></svg>
                </button>
                <button class="icon-button" id="settingsButton" type="button" aria-label="打开设置" aria-expanded="false" title="设置">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.25A3.75 3.75 0 1 1 12 15.75 3.75 3.75 0 0 1 12 8.25Zm0-5v2m0 13.5v2M3.25 12h2m13.5 0h2M5.8 5.8l1.4 1.4m9.6 9.6 1.4 1.4m0-12.4-1.4 1.4m-9.6 9.6-1.4 1.4" /></svg>
                </button>
            </div>
        </header>

        <section class="context-strip" aria-live="polite">
            <div class="context-primary">
                <span class="context-label">当前目标</span>
                <strong id="contextTitle">正在读取 After Effects…</strong>
            </div>
            <dl class="context-metrics">
                <div><dt>图层</dt><dd id="layerCount">—</dd></div>
                <div><dt>属性</dt><dd id="propertyCount">—</dd></div>
            </dl>
        </section>

        <div class="workbench">
            <aside class="category-rail" aria-label="资源分类与目录">
                <div class="library-switch" aria-label="工作台模式">
                    <button type="button" data-mode="tools" aria-pressed="true">工具</button>
                    <button type="button" data-mode="presets" aria-pressed="false">预设</button>
                </div>
                <nav id="categoryNav"></nav>
                <section class="folder-panel" id="folderPanel" aria-label="已录入目录" hidden>
                    <header>
                        <strong>目录</strong>
                        <button type="button" id="clearFolderButton">全部</button>
                    </header>
                    <div class="folder-tree" id="folderTree"></div>
                </section>
                <div class="rail-foot">
                    <span>V1.3.1</span>
                    <span id="toolCount">12 TOOLS</span>
                </div>
            </aside>

            <main class="catalog-stage">
                <div class="catalog-toolbar">
                    <label class="search-field" for="searchInput">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 5 5" /></svg>
                        <input id="searchInput" type="search" placeholder="搜索工具、用途或分类" autocomplete="off">
                        <kbd>/</kbd>
                    </label>
                    <div class="preset-actions" id="presetActions" hidden>
                        <button type="button" id="addPresetButton" title="添加一个或多个 .ffx 文件">＋添加预设</button>
                        <button type="button" id="scanDirectoryButton" title="递归扫描文件夹及其子文件夹">＋扫描目录</button>
                        <button type="button" id="refreshDirectoriesButton" title="重新扫描已记录目录">刷新目录</button>
                    </div>
                    <div class="result-count" id="resultCount">12 项</div>
                </div>

                <div class="catalog-scroll" id="catalogScroll">
                    <div class="cue-grid" id="toolGrid" aria-live="polite"></div>
                    <div class="empty-state" id="emptyState" hidden>
                        <svg viewBox="0 0 80 58" aria-hidden="true"><path d="M7 8h66v42H7zM18 20h20m-20 9h44m-44 9h30" /></svg>
                        <strong>没有匹配的工具</strong>
                        <p>尝试缩短关键词，或切换到“全部工具”。</p>
                        <button type="button" id="clearFiltersButton">清除筛选</button>
                        <div class="empty-preset-actions" id="emptyPresetActions" hidden>
                            <button type="button" id="emptyAddPresetButton">＋添加预设</button>
                            <button type="button" id="emptyScanDirectoryButton">＋扫描目录</button>
                        </div>
                    </div>
                </div>

                <section class="detail-drawer" id="detailDrawer" aria-label="工具参数" aria-hidden="true">
                    <div class="drawer-handle" aria-hidden="true"></div>
                    <header class="drawer-header">
                        <div>
                            <span id="drawerType">EXPRESSION</span>
                            <h2 id="drawerTitle">工具标题</h2>
                        </div>
                        <button class="icon-button" id="closeDrawerButton" type="button" aria-label="关闭参数面板">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
                        </button>
                    </header>
                    <p class="drawer-description" id="drawerDescription"></p>
                    <div class="requirement-line" id="drawerRequirement"></div>
                    <div class="preset-drawer-preview" id="presetDrawerPreview" hidden>
                        <img id="presetDrawerImage" src="assets/preset-previews/roxy-water-ruins.webp" alt="预设缩略图">
                        <video id="presetDrawerVideo" muted loop controls preload="metadata" hidden></video>
                        <div>
                            <button class="secondary-button preview-render-button" id="renderPreviewButton" type="button">生成 AE 真实预览</button>
                            <button class="secondary-button" id="assignThumbnailButton" type="button">指定 PNG / WebP 缩略图</button>
                            <small id="presetPath"></small>
                        </div>
                    </div>
                    <form class="parameter-form" id="parameterForm"></form>
                    <div class="drawer-actions">
                        <button class="secondary-button" id="favoriteDrawerButton" type="button">加入收藏</button>
                        <button class="execute-button" id="executeButton" type="button">
                            <span>执行工具</span>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 9 7-9 7V5Z" /></svg>
                        </button>
                    </div>
                </section>
            </main>
        </div>

        <footer class="status-bar" id="statusBar" data-tone="neutral" aria-live="polite">
            <span class="status-indicator"></span>
            <strong id="statusTitle">READY</strong>
            <p id="statusMessage">选择一张工具卡查看参数</p>
            <time id="statusTime">--:--:--</time>
        </footer>

        <section class="settings-popover" id="settingsPopover" aria-label="面板设置" hidden>
            <header><strong>工作台设置</strong><button class="icon-button" id="closeSettingsButton" type="button" aria-label="关闭设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg></button></header>
            <label class="setting-row">
                <span><b>界面动效</b><small>卡片悬停时显示播放扫描线</small></span>
                <input id="motionToggle" type="checkbox" checked>
            </label>
            <label class="setting-row">
                <span><b>自动真实预览</b><small>FFX 首次悬停 650ms 后由 AE 生成并缓存 MP4</small></span>
                <input id="autoPreviewToggle" type="checkbox" checked>
            </label>
            <label class="setting-row">
                <span><b>紧凑布局</b><small>缩小卡片间距，显示更多工具</small></span>
                <input id="compactToggle" type="checkbox">
            </label>
            <p class="settings-note" id="settingsNote">正在检测 FFmpeg；检测完成前不会启动 AE 实渲。</p>
        </section>
    </div>
    <script src="js/catalog.js"></script>
    <script src="js/host-bridge.js"></script>
    <script src="js/preset-store.js"></script>
    <script src="js/preview-renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
